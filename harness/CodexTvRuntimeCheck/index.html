<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Stremio Standalone Tizen Wrapper POC" />
    <title>StremioWebWrapperPOC</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script src="js/main.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Full-screen iframe for Stremio Web -->
        <div id="iframe-container" class="iframe-container">
            <iframe id="app-iframe" src="about:blank" allowfullscreen></iframe>
        </div>

        <!-- Loading Surface -->
        <div id="loading-screen" class="loading-screen">
            <div class="spinner"></div>
            <p id="loading-status">Loading Stremio...</p>
        </div>

        <!-- Control / Settings Overlay -->
        <div id="control-panel" class="control-panel" role="region" aria-label="Controls">
            <div class="panel-header">
                <h2>Stremio Web Wrapper POC</h2>
            </div>
            <div class="control-group">
                <button id="toggle-mode-btn" type="button" class="btn">Mode: Iframe</button>
                <button id="launch-btn" type="button" class="btn">Launch</button>
                <button id="toggle-diag-btn" type="button" class="btn">Toggle Diagnostics</button>
            </div>
            <!-- Diagnostics container -->
            <div id="diagnostics-panel" class="diagnostics-panel hidden">
                <h3>Diagnostics</h3>
                <pre id="runtime-log">Waiting for runtime...</pre>
            </div>
        </div>
    </div>
</body>
</html>
